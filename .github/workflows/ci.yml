name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm config set registry https://registry.npmjs.org/
          npm ci --prefer-online --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=60000
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Security audit
        run: npm audit --audit-level=high
